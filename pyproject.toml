[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atk"
version = "0.8.1"
description = "Инструменты для автоматизации"
readme = "README.md"
requires-python = ">=3.8.1"
authors = [
    {name = "Nekit-py", email = "nekit-py@yandex.ru"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Office/Business",
    "Topic :: Communications :: Email",
]

dependencies = [
    "pydantic[email]>=2.0.0",
    "aiosmtplib>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "asyncpg>=0.25.0",
    "python-dotenv>=1.0.0",
    "cx-Oracle-async>=0.3.3",
    "PyYAML>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    # Type stubs
    "pandas-stubs>=2.0.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.0.0",
    "asyncpg-stubs>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/Nekit-py/atk"
Repository = "https://github.com/Nekit-py/atk"
Issues = "https://github.com/Nekit-py/atk/issues"
Documentation = "https://github.com/Nekit-py/atk#readme"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=atk --cov-report=term-missing"
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["atk"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
    "raise ImportError",
]
show_missing = true
skip_covered = false

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Игнорировать отсутствующие импорты для внешних библиотек
ignore_missing_imports = false
# Показывать коды ошибок
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Для библиотек без типов
[[tool.mypy.overrides]]
module = [
    "cx_Oracle_async.*",
    "aiosmtplib.*",
    "openpyxl.*",
]
ignore_missing_imports = true

# Игнорирование specific ошибок для модулей БД
[[tool.mypy.overrides]]
module = ["atk.db.*"]
disable_error_code = ["attr-defined"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Ruff configuration (modern linter, faster alternative to flake8)
[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit (security)
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # useless expression in tests

# Hatch configuration for build
[tool.hatch.build.targets.wheel]
packages = ["atk"]

[tool.hatch.build.targets.sdist]
include = [
    "/atk",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]