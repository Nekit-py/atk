version: 1
disable_existing_loggers: false
formatters:
  simple:
    format: '[%(levelname)s - %(asctime)s] [%(name)s] -> %(message)s'
    datefmt: "%d.%m.%Y %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: simple
    filename: logs/logs.log
    when: 'midnight'
    interval: 1
    backupCount: 30
    encoding: utf8
loggers:
  simpleExample:
    level: INFO
    handlers: [console]
    propagate: no
root:
  level: INFO
  handlers: [console,file]